<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative unit responsiveness</title>
    <style>
        html{
            font-size: 16px;
        }
        /* em for responsiveness */
        @media  (max-width: 800px) {
            .em{
                font-size: 3em;
            }        
        }
        /* rem for responsiveness */
        @media (min-width: 850px) {
            .rem{
                font-size: 5rem;
            }
            
        }
    </style>
</head>
<body>
    <div class="em">Lorem ipsum dolor sit amet.</div>
    <div class="rem">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Odit.</div>
</body>
</html>
