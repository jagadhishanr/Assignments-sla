<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vh/vw</title>
    <style>
        /* view-port height */
        .vh {
            background-color: blue;
            height: 50vh;
            text-align: center;
        }

        /* view-port width */
        .vw {
            background-color: blueviolet;
            width: 50vw;
        }
    </style>
</head>

<body>
    <!-- vh -->

    <div class="vh">
        <h1>viewport height</h1>
    </div>
    <!-- vw -->
    <div class="vw">
        <h1>viewport width</h1>
    </div>
</body>

</html>
