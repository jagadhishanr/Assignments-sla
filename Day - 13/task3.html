<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css units</title>
    <style>
        /* em css units */
        .em-1 {
            font-size: 63px;
        }

        .em-2 {
            font-size: 3em;
        }

        /* rem css units */
        html {
            font-size: 32px;
        }

        .rem-2 {
            font-size: 4rem;
        }
    </style>
</head>

<body>
    <!-- em css units -->
    <h1>Em css units</h1>
    <div class="em-1" style="font-size: 6em;">Lorem ipsum dolor sit am
    </div>
    <div class="em-2">Lorem, ipsum dolor sit amet consectetur adipisicing elit.
    </div>
    <!-- rem css units -->
    <h1>rem css units</h1>
    <div class="rem-1" style="font-size: 2rem;">Lorem ipsum, dolor sit amet consectetur adipisicing.
    </div>
    <div class="rem-2">Lorem ipsum dolor sit.
    </div>
</body>

</html>
