<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float/Clearfix</title>
    <style>
        .jagan {
            clear: both;
        }

        img {
            float: right;
            width: 300px;
        }
    </style>
</head>

<body>
    <div class="jagan">
        <img src="my photo.jpg" alt="">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempore maiores sapiente officiis expedita! Quaerat nobis incidunt harum recusandae ex culpa?</p>
    </div>
</body>

</html>
