<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .one{
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            color: white;
        }
    </style>
</head>
<body>
    <div class="one">
        <div class="box">html</div>
        <div class="box">css</div>
        <div class="box">javascript</div>
    </div>
</body>
</html>
