<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2x2 Grid</title>
    <style>
        .front-end{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }

        .front-end div {
            background: rgb(144, 18, 18);
            text-align: center;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="front-end">
        <div>html</div>
        <div>css</div>
        <div>javascript</div>
        <div>react</div>
    </div>
</body>
</html>
